# Publishes a GitHub release when a version tag is pushed:
#
#   git tag 0.2.0
#   git push origin 0.2.0
#
# The tag sets the app version, so the <Version> in RoboUI.csproj doesn't need to be edited.
# If the WINGET_TOKEN secret exists, a pull request updating f0lder.RoboUI in winget-pkgs is opened too.
# If the SIGNPATH_API_TOKEN secret exists, the exe is code-signed through SignPath first
# (see .signpath/README.md for the one-time setup).
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: "\"version=$env:GITHUB_REF_NAME\" >> $env:GITHUB_OUTPUT"

      - name: Test
        run: dotnet test RoboUI.slnx -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish RoboUI/RoboUI.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # ---- Code signing (SignPath Foundation) --------------------------------------------------
      # Runs only once the SIGNPATH_API_TOKEN secret exists; until then the release is unsigned.
      # Every signing request has to be approved in SignPath, so this step waits for that.
      - name: Upload unsigned exe
        id: upload-unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: RoboUI-unsigned
          path: publish/RoboUI.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'RoboUI' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Use signed exe
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item signed/RoboUI.exe publish/RoboUI.exe -Force
          $signature = Get-AuthenticodeSignature publish/RoboUI.exe
          "Signature: $($signature.Status) by $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw 'The exe that came back from SignPath is not validly signed.' }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $hash = (Get-FileHash publish/RoboUI.exe -Algorithm SHA256).Hash
          $notes = @"
          Download **RoboUI.exe** and run it. No installation or .NET needed (Windows 10/11 x64).

          SHA256: ``$hash``
          "@
          gh release create $version publish/RoboUI.exe --title "RoboUI $version" --notes "$notes" --generate-notes

  winget:
    needs: release
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Update winget manifest
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = '${{ needs.release.outputs.version }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/$version/RoboUI.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update f0lder.RoboUI --version $version --urls $url --submit --token $env:WINGET_TOKEN

      - name: Skipped
        if: env.WINGET_TOKEN == ''
        run: echo "No WINGET_TOKEN secret, so winget-pkgs was not updated."
